[package]
name = "sepia-core"
version = "1.0.0"
edition = "2021"
description = "sepia data plane: chained SOCKS5/HTTP proxy with DoH resolver"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
