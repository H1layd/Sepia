[package]
name = "sepia-browser"
version = "0.1.0"
edition = "2021"
build = "build.rs"
description = "A browser written from scratch: own parser, cascade, layout and rasteriser"
license = "MIT"

[dependencies]
fontdue = "0.9"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ttf-parser = "0.25"
swash = "0.2"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
png = "0.17"
rustls = "0.23"
webpki-roots = "0.26"
winit = { version = "0.29", features = ["rwh_05"] }
softbuffer = "0.4"
zune-jpeg = "0.5.15"
zune-core = "0.5"
gif = { version = "0.14", default-features = false, features = ["std"] }
v8 = "=152.2.0"
html5ever = "=0.40.1"
selectors = "=0.43.0"
taffy = { version = "=0.15.1", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree", "content_size"] }
cssparser = "0.38"
precomputed-hash = "0.1"
markup5ever_rcdom = "=0.40.1"
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b", "intl_bundled", "temporal"] }
miniz_oxide = "0.8"
image-webp = "0.2.4"
brotli-decompressor = "5.0.0"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true

# Boa 0.22 fixes, marked "Sepia patch" in the sources:
# - boa_ast: `this` lost in arrows nested inside arrows (src/scope.rs)
# - boa_engine: Array/TypedArray sort panicked on inconsistent comparators
#   (src/builtins/array/mod.rs)
[patch.crates-io]
boa_parser = { path = "vendor/boa_parser" }
boa_ast = { path = "vendor/boa_ast" }
boa_engine = { path = "vendor/boa_engine" }
