[package]
name = "sepia-browser"
version = "0.1.0"
edition = "2021"
description = "A browser written from scratch: own parser, cascade, layout and rasteriser"
license = "MIT"

[dependencies]
fontdue = "0.9"
png = "0.17"
rustls = "0.23"
webpki-roots = "0.26"
winit = "0.29"
softbuffer = "0.4"
zune-jpeg = "0.5.15"
zune-core = "0.5"
gif = { version = "0.14", default-features = false, features = ["std"] }
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }
miniz_oxide = "0.8"
image-webp = "0.2.4"
brotli-decompressor = "5.0.0"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
